<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Content Security Policy. Defends the rich-text Terms / Notes / extra-section
      paths which inject sanitized HTML via DOMPurify. Even if the sanitizer config
      is ever loosened, the CSP locks scripts to same-origin so injected script
      tags can't execute, and connect-src is limited to localhost + Google
      services (only place we make outbound calls).
    -->
    <!--
      v1.10.33 — Tesseract assets now bundled into public/tesseract/ by
      scripts/bundle-tesseract-assets.mjs. That means:
        - script-src no longer needs https://cdn.jsdelivr.net (worker
          serves from same-origin)
        - connect-src no longer needs jsdelivr or tessdata.projectnaptha
          (traineddata + core WASM serve from same-origin)
      What STAYS wide:
        - 'wasm-unsafe-eval' in script-src → tesseract-core compiles a
          WebAssembly module, which requires this outside of a fresh
          instantiation flow
        - worker-src 'self' blob: → tesseract creates its worker from a
          blob URL. Without an explicit worker-src, it falls back to
          script-src (which excludes blob:) and blocks the worker.
        - style-src http://localhost:* → html2canvas clones the invoice
          into an ABOUT:BLANK iframe before rasterising it. Firefox
          inherits the CSP into that iframe but resolves 'self' against
          about:blank's NULL origin, so 'self' matches nothing and the
          app's own stylesheet is refused — the PDF then renders
          UNSTYLED. Chrome resolves 'self' to the inherited origin, which
          is why this never showed up in Chrome testing. Naming the real
          origin sidesteps the 'self' resolution entirely; connect-src
          already lists http://localhost:* for a comparable reason.
          Reported as "pdf save as thermal printer" — it was not thermal,
          it was an invoice with no CSS.
          v1.10.77: http://127.0.0.1:* as well, for the app opened by that
          address (the PDF lost its stylesheet there).
        - frame-src 'self' blob: → Print and Save-as-PDF render the
          generated PDF into a hidden iframe via createObjectURL (see
          printViaIframe in InvoiceGenerator.jsx and the same pattern in
          PrintSettings.jsx). Without blob: here the iframe is blocked
          outright and Print silently does nothing. Reported on Firefox,
          which enforces frame-src against blob: strictly; Chrome was
          laxer, which is why this survived to v1.10.46 unnoticed.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src  'self' 'wasm-unsafe-eval' https://accounts.google.com https://apis.google.com;
      worker-src  'self' blob:;
      style-src   'self' 'unsafe-inline' http://localhost:* http://127.0.0.1:* https://fonts.googleapis.com;
      font-src    'self' https://fonts.gstatic.com data:;
      img-src     'self' data: blob: https://*.googleusercontent.com;
      connect-src 'self' http://localhost:* https://accounts.google.com https://www.googleapis.com https://api.github.com https://nodejs.org https://raw.githubusercontent.com;
      frame-src   'self' blob: https://accounts.google.com;
      object-src  'none';
      base-uri    'self';
    " />

    <!-- Primary SEO -->
    <title>Sanskar Palace — Billing &amp; Front Desk</title>
    <meta name="description" content="Billing and front-desk management for Sanskar Palace Hotel &amp; Resort, Garoth (Shamgarh), Madhya Pradesh. GST tax invoices, advance receipts, room check-in / check-out, reservations and event bookings — all in one place." />
    <meta name="keywords" content="Sanskar Palace, Sanskar Palace Hotel & Resort, Garoth hotel, Shamgarh hotel, hotel billing, hotel front desk, room booking, GST invoice, hotel management" />
    <meta name="author" content="Sanskar Palace Hotel & Resort" />
    <!-- Private, login-gated internal tool — keep it out of search engines. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://sanskarpalace.vercel.app/" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sanskar Palace Hotel & Resort" />
    <meta property="og:title" content="Sanskar Palace — Billing & Front Desk" />
    <meta property="og:description" content="Billing and front-desk management for Sanskar Palace Hotel & Resort, Garoth (M.P.) — tax invoices, advance receipts, room bookings and events." />
    <!-- Absolute URL is required — WhatsApp / Facebook / Twitter ignore a
         relative og:image path and show no cover. -->
    <meta property="og:image" content="https://sanskarpalace.vercel.app/og-preview.png" />
    <meta property="og:image:secure_url" content="https://sanskarpalace.vercel.app/og-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sanskar Palace Hotel & Resort" />
    <meta property="og:url" content="https://sanskarpalace.vercel.app/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sanskar Palace — Billing & Front Desk" />
    <meta name="twitter:description" content="Billing and front-desk management for Sanskar Palace Hotel & Resort, Garoth (M.P.) — invoices, receipts, room bookings and events." />
    <meta name="twitter:image" content="https://sanskarpalace.vercel.app/og-preview.png" />

    <!-- Favicon — standard favicon.io raster set (Sanskar Palace logo). -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- v1.10.33 — Chrome deprecated the apple-* variant. Keep both for
         cross-browser installability. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sanskar Palace" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Theme — black to match the gold-on-black Sanskar Palace brand. -->
    <meta name="theme-color" content="#0b0b0b" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Hotel",
      "name": "Sanskar Palace Hotel & Resort",
      "image": "https://sanskarpalace.vercel.app/og-preview.png",
      "url": "https://sanskarpalace.vercel.app/",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Garoth",
        "addressRegion": "Madhya Pradesh",
        "addressCountry": "IN"
      }
    }
    </script>

    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!--
      This file is the React app entry — never opened directly by users.
      It lives in src/ rather than the project root so users don't see
      it in their install folder. The Vite build transforms it into
      dist/index.html which Express serves at http://localhost:47371/.
      The user-facing HTML at the project root is the launcher.
    -->
    <noscript>
      <div style="font-family:sans-serif;padding:2rem;max-width:600px;margin:2rem auto;background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;color:#991b1b">
        <h2>JavaScript is required</h2>
        <p>This is the Sanskar Palace billing &amp; front-desk app. It needs JavaScript to run.</p>
      </div>
    </noscript>

    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
